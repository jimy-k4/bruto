<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bruto: a brutalist, local-first task board for projects built with AI. Notes live in your project folder."
    />
    <meta name="theme-color" content="#1a1a19" />
    <link rel="icon" type="image/svg+xml" href="/brutoIcon.svg" />
    <title>BRUTO</title>
    <script>
      // Apply the saved theme before the first paint, so there is no flash.
      try {
        const theme = localStorage.getItem('bruto-theme')
        const light = theme
          ? theme === 'light'
          : matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
