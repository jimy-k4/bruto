<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bruto · YouTube thumbnail</title>
    <!--
      The launch video's thumbnail on YouTube: 1280×720. Rendered to PNG with
      npx playwright screenshot --channel=chrome --viewport-size=1280,720 docs/social/youtube-thumbnail.html docs/social/youtube-thumbnail.png
      YouTube lays the duration over the bottom right: nothing important goes there.
    -->
    <style>
      @font-face {
        font-family: 'Archivo Black';
        src: url('../../node_modules/@fontsource/archivo-black/files/archivo-black-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 600;
        src: url('../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2')
          format('woff2');
      }

      /* The app's dark theme tokens (src/styles/tokens.css). */
      :root {
        --bg: #1a1a19;
        --surface: #232322;
        --ink: #edece5;
        --ink-muted: #b7b6ae;
        --line: #edece5;
        --signal: #ff6b2c;
        --note-ink: #f2f1ea;
        --pattern-line: rgba(242, 241, 234, 0.16);
        --font-display: 'Archivo Black', 'Arial Black', sans-serif;
        --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }

      body {
        position: relative;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(237, 236, 229, 0.085) 2px, transparent 2px),
          linear-gradient(90deg, rgba(237, 236, 229, 0.085) 2px, transparent 2px),
          linear-gradient(rgba(237, 236, 229, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(237, 236, 229, 0.045) 1px, transparent 1px);
        background-size:
          160px 160px,
          160px 160px,
          32px 32px,
          32px 32px;
        color: var(--ink);
        font-family: var(--font-mono);
      }

      body::after {
        content: '';
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 14px;
        background: var(--signal);
      }

      .brand {
        position: absolute;
        top: 70px;
        left: 64px;
      }

      .eyebrow {
        color: var(--ink-muted);
        font: 600 20px / 1 var(--font-mono);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .wordmark {
        margin: 18px 0 0 -6px;
        font: 400 170px / 0.86 var(--font-display);
        text-shadow: 9px 9px 0 var(--signal);
      }

      .claim {
        margin-top: 44px;
        font: 400 46px / 1.12 var(--font-display);
        text-transform: uppercase;
      }

      .claim mark {
        padding: 0 10px;
        background: var(--ink);
        color: var(--bg);
      }

      /* One note, as the board draws it, answered by the AI. */
      .note {
        position: absolute;
        top: 96px;
        right: 64px;
        width: 400px;
        border: 4px solid var(--line);
        background-color: #57506b;
        color: var(--note-ink);
        box-shadow: 9px 9px 0 var(--line);
        outline: 4px solid var(--signal);
        outline-offset: 7px;
      }

      .note__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 4px solid var(--line);
        background-image: repeating-linear-gradient(
          135deg,
          var(--pattern-line) 0 3px,
          transparent 3px 15px
        );
      }

      .note__header span {
        padding: 3px 8px;
        background: var(--surface);
        color: var(--ink);
        font: 600 16px / 1.2 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .note__header .status::before {
        content: '';
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 8px;
        background: #b3a4ff;
      }

      .note__body {
        display: grid;
        gap: 16px;
        padding: 20px 22px 26px;
      }

      .note__title {
        font: 400 34px / 1.05 var(--font-display);
        text-transform: uppercase;
      }

      .note__ai {
        display: flex;
        align-items: center;
        gap: 10px;
        padding-top: 12px;
        border-top: 3px solid currentColor;
        font: 600 17px / 1.2 var(--font-mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .note__ai i {
        padding: 2px 7px;
        background: var(--note-ink);
        color: #57506b;
        font-style: normal;
      }

      /* The key that copies it for the AI. */
      .key {
        position: absolute;
        top: 470px;
        right: 330px;
        display: grid;
        place-items: center;
        width: 118px;
        height: 118px;
        border: 5px solid #151514;
        background: var(--ink);
        color: #151514;
        font: 400 70px / 1 var(--font-display);
        box-shadow:
          0 10px 0 #8d8c86,
          10px 18px 0 var(--signal);
      }

      .key-label {
        position: absolute;
        top: 500px;
        right: 64px;
        width: 240px;
        font: 600 22px / 1.35 var(--font-mono);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <p class="eyebrow">Project notes for coding with AI</p>
      <p class="wordmark">BRUTO</p>
      <p class="claim">Tasks in <mark>your repo</mark><br />for you and your AI</p>
    </div>

    <article class="note">
      <header class="note__header"><span>Note</span><span class="status">To review</span></header>
      <div class="note__body">
        <h2 class="note__title">Waitlist for full slots</h2>
        <p class="note__ai"><i>AI</i> Response · 3 files</p>
      </div>
    </article>

    <div class="key">Q</div>
    <p class="key-label">Copies the context your AI needs</p>
  </body>
</html>
